<!-- doctype helps HTML run correctly -->
<!doctype html> 

<!-- html "root" element, lang sest language 2 english -->
<html lang="en">
  <!-- head contains everything the users dont see -->
  <head>
    <!-- This means u can use a really big character set -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- ensures page renders the width of the browser -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cpsc-362</title>
  </head>
  <!-- body is everything u want the users to view -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <img src="" alt="My test image" />
  </body>
</html>
